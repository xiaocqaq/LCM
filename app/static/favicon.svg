<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 标签页图标：墨绿圆角底 + 白色脑轮廓，跟站内品牌图标 #i-brain 同一套形状。
       为什么带底色：脑图标是线性描边的，直接放在标签栏上时
       浅色主题下白描边看不见、深色主题下深描边看不见 ——
       给它一个固定的墨绿底，两种浏览器主题下都是同一个可辨认的色块。
       viewBox 用 32 而不是 16：图标原稿是 16 网格，放大一倍留出内边距，
       缩到 16px 显示时描边不会糊成一团。 -->
  <rect width="32" height="32" rx="7" fill="#1f4d3d"/>
  <g transform="translate(4 4) scale(1.5)" fill="none" stroke="#ffffff"
     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.6 2.6a2.2 2.2 0 0 1 2.2 2.2v7.4a1.8 1.8 0 0 1-3.4.8"/>
    <path d="M6.6 2.6a2.4 2.4 0 0 0-2.3 3 2.2 2.2 0 0 0-.6 3.6 2 2 0 0 0 1.5 3.4"/>
    <path d="M9.4 2.6a2.2 2.2 0 0 0-2.2 2.2"/>
    <path d="M9.4 2.6a2.4 2.4 0 0 1 2.3 3 2.2 2.2 0 0 1 .6 3.6 2 2 0 0 1-1.5 3.4 1.8 1.8 0 0 1-1.9-1.6"/>
  </g>
</svg>
